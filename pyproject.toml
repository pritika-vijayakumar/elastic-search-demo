[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-shopping-demo"
version = "0.1.0"
description = "Elasticsearch semantic and hybrid retrieval with grounded OpenAI answers"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9.1,<10",
  "openai>=2,<3",
  "streamlit>=1.40,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

